# The wheel carries what an installed mLaTeX's library is, laid out the way
# it finds its fonts: mlatex_ffi beside an assets folder, both copied in by the
# release. One wheel per system and architecture, for every Python, since
# ctypes loads the library and nothing is compiled against Python itself.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlatex"
dynamic = ["version"]
description = "Typeset LaTeX into PDF from Python with the bundled mLaTeX engine and fonts."
readme = { file = "README.md", content-type = "text/markdown" }
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSING.md", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.9"
authors = [{ name = "Andres Hernandez", email = "andromedeyz@hotmail.com" }]
keywords = ["latex", "pdf", "typesetting"]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/modern-latex/mlatex"
Repository = "https://github.com/modern-latex/mlatex"
Documentation = "https://github.com/modern-latex/mlatex#embedding-the-engine"
Issues = "https://github.com/modern-latex/mlatex/issues"
Changelog = "https://github.com/modern-latex/mlatex/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "env"
variable = "MLATEX_VERSION"

[tool.hatch.build.targets.wheel]
packages = ["mlatex"]
artifacts = ["mlatex/*.dll", "mlatex/*.so", "mlatex/*.dylib", "mlatex/assets/**"]
